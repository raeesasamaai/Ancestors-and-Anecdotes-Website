<!doctype html>
<html lang="en">

<head>
  <!-- =====================================================
         BASIC DOCUMENT SETTINGS
    ====================================================== -->

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <!-- =====================================================
         PAGE TITLE
    ====================================================== -->

  <title>
    Ancestors &amp; Anecdotes | Genealogy &amp; Family History Research
  </title>


  <!-- =====================================================
         PRIMARY SEO DESCRIPTION
    ====================================================== -->

  <meta name="description"
    content="Ancestors & Anecdotes helps individuals and families uncover, preserve, and share their family history through genealogy research, family tree charts, historical records, oral histories, and personalised family stories." />

  <!-- =====================================================
         THEME / BROWSER METADATA
    ====================================================== -->

  <meta name="theme-color" content="#F5E6CC" />

  <meta name="color-scheme" content="light" />


  <!-- =====================================================
         FAVICON

         Replace these paths once the final logo/favicon
         assets are ready.

         Recommended final files:

         /favicon.ico
         /favicon.svg
         /apple-touch-icon.png
    ====================================================== -->

  <!--
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    -->


  <!-- =====================================================
         OPEN GRAPH

         Used by:
         Facebook
         WhatsApp
         LinkedIn
         Messenger
         Other social platforms
    ====================================================== -->

  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="Ancestors & Anecdotes" />

  <meta property="og:title" content="Ancestors & Anecdotes | Genealogy & Family History Research" />

  <meta property="og:description"
    content="Discover, preserve, and share your family history through thoughtful genealogy research, historical records, family tree charts, oral histories, and personalised storytelling." />


  <!-- =====================================================
         OPEN GRAPH URL

         ADD THIS ONLY WHEN THE FINAL DOMAIN IS CONNECTED.

         EXAMPLE:

         <meta
           property="og:url"
           content="https://YOUR-FINAL-DOMAIN.co.za/"
         />
    ====================================================== -->


  <!-- =====================================================
         OPEN GRAPH IMAGE

         ADD THIS AFTER YOUR FINAL SOCIAL PREVIEW IMAGE
         HAS BEEN CREATED.

         Recommended image:
         1200 × 630px

         EXAMPLE:

         <meta
           property="og:image"
           content="https://YOUR-FINAL-DOMAIN.co.za/og-image.jpg"
         />

         <meta
           property="og:image:width"
           content="1200"
         />

         <meta
           property="og:image:height"
           content="630"
         />

         <meta
           property="og:image:alt"
           content="Ancestors & Anecdotes genealogy and family history research"
         />
    ====================================================== -->


  <!-- =====================================================
         TWITTER / X METADATA

         For now we use a normal summary card because the
         final social image has not been added yet.

         Change to:
         summary_large_image

         after your OG image is ready.
    ====================================================== -->

  <meta name="twitter:card" content="summary" />

  <meta name="twitter:title" content="Ancestors & Anecdotes | Genealogy & Family History Research" />

  <meta name="twitter:description"
    content="Discover, preserve, and share your family history through genealogy research, historical records, family tree charts, oral histories, and personalised storytelling." />


  <!-- =====================================================
         CANONICAL URL

         DO NOT point the canonical URL to the temporary
         Netlify domain.

         ADD THIS AFTER THE FINAL DOMAIN IS CONNECTED.

         EXAMPLE:

         <link
           rel="canonical"
           href="https://YOUR-FINAL-DOMAIN.co.za/"
         />
    ====================================================== -->
</head>


<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
